<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Birthday Program 💻</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(
            circle at top left,
            rgba(255, 0, 180, 0.35),
            transparent 30%
          ),
          radial-gradient(
            circle at bottom right,
            rgba(0, 255, 255, 0.25),
            transparent 35%
          ),
          linear-gradient(135deg, #0b1026 0%, #1b1540 45%, #0f1735 100%);
        color: #fef3ff;
        font-family: "Trebuchet MS", "Segoe UI", monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
        overflow-x: hidden;
        position: relative;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body::before {
        content: "";
        position: fixed;
        inset: -20%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.12) 1px,
          transparent 1px
        );
        background-size: 24px 24px;
        animation: drift 16s linear infinite;
        opacity: 0.35;
        pointer-events: none;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(
          circle at center,
          rgba(255, 105, 180, 0.12),
          transparent 60%
        );
        animation: pulseGlow 4s ease-in-out infinite;
        pointer-events: none;
      }

      .bg-orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(20px);
        opacity: 0.35;
        animation: float 8s ease-in-out infinite;
        z-index: 0;
      }

      .orb-1 {
        width: 220px;
        height: 220px;
        background: #ff3d7a;
        top: 8%;
        left: 6%;
      }

      .orb-2 {
        width: 180px;
        height: 180px;
        background: #22d3ee;
        bottom: 8%;
        right: 10%;
        animation-delay: -3s;
      }

      .orb-3 {
        width: 120px;
        height: 120px;
        background: #facc15;
        top: 45%;
        left: 45%;
        animation-delay: -1.5s;
      }

      #output {
        position: relative;
        z-index: 1;
        width: min(100%, 900px);
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 24px;
        padding: 28px 24px;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        white-space: pre-wrap;
        font-size: clamp(16px, 2vw, 22px);
        line-height: 1.7;
        text-align: center;
        margin-top: 0;
        word-break: break-word;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.12);
      }

      .char {
        display: inline-block;
        animation: popIn 0.2s ease-out;
      }

      .heart {
        line-height: 0.95;
        font-size: clamp(16px, 3vw, 24px);
        margin-top: 30px;
        color: #ff5fa2;
        text-shadow: 0 0 12px rgba(255, 95, 162, 0.45);
        animation: pulse 1.6s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-20px) scale(1.04);
        }
      }

      @keyframes pulseGlow {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.5;
        }
        50% {
          transform: scale(1.08);
          opacity: 0.8;
        }
      }

      @keyframes drift {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(30px);
        }
      }

      @keyframes popIn {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.04);
        }
      }

      @media (max-width: 600px) {
        body {
          padding: 16px;
          align-items: flex-start;
          padding-top: 24px;
        }

        #output {
          padding: 20px 16px;
          font-size: 15px;
          text-align: center;
        }

        .heart {
          font-size: 16px;
          margin-top: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
    <div id="output"></div>
    <script>
      const output = document.getElementById("output");
      function slowPrint(msg, delay = 40) {
        return new Promise((resolve) => {
          let i = 0;
          function type() {
            if (i < msg.length) {
              const char = msg[i];
              output.innerHTML +=
                char === " " ? "&nbsp;" : `<span class="char">${char}</span>`;
              i++;
              setTimeout(type, delay);
            } else {
              output.innerHTML += "<br>";
              resolve();
            }
          }
          type();
        });
      }
      function clearScreen() {
        output.innerHTML = "";
      }
      async function heartAnimation() {
        const heart = [
          "   ..       ..   ",
          "  ....     ....  ",
          " ......   ...... ",
          " ............... ",
          "  .............  ",
          "   ...........   ",
          "     ........     ",
          "       .....       ",
          "        ...        ",
          "         .         ",
        ];

        for (let i = 0; i < 3; i++) {
          clearScreen();
          output.innerHTML =
            "<div class='heart'>" + heart.join("<br>") + "</div>";
          await new Promise((r) => setTimeout(r, 1000));
        }
        clearScreen();
      }
      async function runProgram() {
        clearScreen();
        await slowPrint("Booting birthday program 💻...");
        await new Promise((r) => setTimeout(r, 1000));
        await heartAnimation();
        await slowPrint("Hey babe 💕");
        await new Promise((r) => setTimeout(r, 1000));
        await slowPrint("I know today’s your special day...");
        await new Promise((r) => setTimeout(r, 1000));
        await slowPrint("So I wrote this code just for you 🥺💖");
        await new Promise((r) => setTimeout(r, 1000));
        await slowPrint("Happy birthday my love! 🎉🎂");
        await new Promise((r) => setTimeout(r, 1000));
        await slowPrint("You're not just special to me...");
        await slowPrint("You're the entire main function in my life 😌");
        await new Promise((r) => setTimeout(r, 1000));
        await slowPrint(
          "No syntax error could ever stop what I feel for you 💘",
        );
        await new Promise((r) => setTimeout(r, 1000));
        await slowPrint(
          "And I want you to always be my heart, my joy, and my everything 💘",
        );
        await new Promise((r) => setTimeout(r, 1000));
        await slowPrint(
          "I always have sleepless nights, thinking about how to achieve my dreams with you 💘",
        );
        await new Promise((r) => setTimeout(r, 1000));
        await slowPrint(
          "I pray this year brings you peace, growth, and all the joy you deserve.",
        );
        await slowPrint(
          "And don’t forget, I’ll always be here—debugging life with you 😄",
        );
        output.innerHTML += "<br><br>With all my love,<br>Daredevil 💔 ❤";
      }
      runProgram();
    </script>
  </body>
</html>
